services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "3010:3000"
    environment:
      SERVER_ROLE: student
      PORT: 3000
      DATABASE_URL: postgres://feedback:feedback@db:5432/feedback
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy

  teacher:
    build: .
    env_file:
      - .env
    ports:
      - "3011:3001"
    environment:
      SERVER_ROLE: teacher
      PORT: 3001
      DATABASE_URL: postgres://feedback:feedback@db:5432/feedback
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feedback
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
    volumes:
      - feedback-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  feedback-data: